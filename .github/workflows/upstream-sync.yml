name: Propose upstream updates

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  validate-candidate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    env:
      WALSALIB_REQUIRE_ML: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python tools/sync_upstreams.py --update
      - run: python tools/sync_upstreams.py --check
      - name: Validate candidate distributions and numerical contracts
        run: |
          python -m pip install build twine pytest setuptools
          python -m build
          python -m twine check --strict dist/*
          python tools/check_dist.py dist
          python -m pip install "$(find dist -name '*.whl' -print -quit)[softg]"
          python -m pip check
          python -m pytest tests/release -q
      - name: Prepare a source-only proposal
        id: patch
        run: |
          git diff --binary -- vendor src/WaLSAlib/_vendor > /tmp/upstream-update.patch
          if test -s /tmp/upstream-update.patch; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: steps.patch.outputs.changed == 'true'
        with:
          name: upstream-proposal
          path: /tmp/upstream-update.patch
          if-no-files-found: error
  propose:
    needs: validate-candidate
    if: needs.validate-candidate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: upstream-proposal
          path: /tmp/upstream-proposal
      - name: Push the validated proposal and open a review PR
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git apply --index /tmp/upstream-proposal/upstream-update.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update pinned SoFT and SoFTg sources'
          branch=codex/upstream-sync
          # This branch is reserved for generated proposals, never for hand edits.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          cat > /tmp/upstream-pr.md <<'BODY'
          Refresh the pinned SoFT/SoFTg source snapshots and regenerate namespace import adapters.

          Candidate validation passed snapshot hashes, deterministic adapters, distribution metadata/content audits, installed imports, synthetic tracking/segmentation parity, and the ML forward/backward/CLI checks. See the Propose upstream updates workflow run for logs.

          Review upstream commit IDs, source/dependency/license changes, and scientific behavior on reference observations before merging. No automatic merge or PyPI publication is performed. See docs/upstream.md.
          BODY
          number=$(gh pr list --head "$branch" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if test -n "$number"; then
            gh pr edit "$number" --title 'Update pinned SoFT and SoFTg sources' --body-file /tmp/upstream-pr.md
          else
            gh pr create --head "$branch" --base "$BASE_BRANCH" --title 'Update pinned SoFT and SoFTg sources' --body-file /tmp/upstream-pr.md
          fi
