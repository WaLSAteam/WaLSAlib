name: Publish reviewed release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Package index
        type: choice
        required: true
        default: testpypi
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  release-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Require a version tag matching the package
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'CHECK'
          import os, tomllib
          with open('pyproject.toml', 'rb') as handle:
              version = tomllib.load(handle)['project']['version']
          assert os.environ['REF_TYPE'] == 'tag', 'Run this workflow on a reviewed release tag'
          assert os.environ['REF_NAME'] == 'v' + version, 'Tag must match package version'
          CHECK
  validate:
    needs: release-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  testpypi:
    if: inputs.target == 'testpypi'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/WaLSAlib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
  pypi:
    if: inputs.target == 'pypi'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/WaLSAlib
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
