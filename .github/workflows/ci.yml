name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  distributions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine pytest setuptools
      - run: python tools/sync_upstreams.py --check
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_dist.py dist
      - name: Install and test the wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -m pytest tests/release -q
      - name: Rebuild wheel from the source distribution
        run: |
          mkdir -p /tmp/walsalib-sdist /tmp/walsalib-rebuilt
          tar -xzf dist/*.tar.gz -C /tmp/walsalib-sdist
          python -m build --wheel --outdir /tmp/walsalib-rebuilt /tmp/walsalib-sdist/*
          python -m pip install --force-reinstall --no-deps /tmp/walsalib-rebuilt/*.whl
          python -m pytest tests/release -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.python == '3.12'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  ml:
    needs: distributions
    runs-on: ubuntu-latest
    env:
      WALSALIB_REQUIRE_ML: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist
      - name: Install the wheel with ML dependencies
        run: |
          python -m pip install pytest
          python -m pip install "$(find dist -name '*.whl' -print -quit)[softg]"
          python -m pip check
      - run: python -m pytest tests/release -q
