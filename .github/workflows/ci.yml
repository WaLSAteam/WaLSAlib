name: Release checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  distributions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine pytest setuptools
      - run: python tools/sync_upstreams.py --check
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python tools/check_dist.py dist
      - name: Install and test the wheel
        run: |
          python -m pip install dist/*.whl
          python -m pip check
          python -m pytest tests/release -q
      - name: Rebuild wheel from the source distribution
        run: |
          mkdir -p /tmp/walsalib-sdist /tmp/walsalib-rebuilt
          tar -xzf dist/*.tar.gz -C /tmp/walsalib-sdist
          python -m build --wheel --outdir /tmp/walsalib-rebuilt /tmp/walsalib-sdist/*
          python -m pip install --force-reinstall --no-deps /tmp/walsalib-rebuilt/*.whl
          python -m pytest tests/release -q
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: matrix.python == '3.12'
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
  ml:
    needs: distributions
    runs-on: ubuntu-latest
    env:
      WALSALIB_REQUIRE_ML: "1"
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: distributions
          path: dist
      - name: Install the wheel with ML dependencies
        run: |
          python -m pip install pytest
          python -m pip install "$(find dist -name '*.whl' -print -quit)[softg]"
          python -m pip check
      - run: python -m pytest tests/release -q
